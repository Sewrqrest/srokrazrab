<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор Сроков Проекта</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Настройки -->
    <div class="lg:col-span-5 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-5">
      <h2 class="text-xl font-bold text-indigo-400">Параметры проекта</h2>
      
      <!-- Тип сайта -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Тип проекта</label>
        <select id="projectType" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="landing">Лендинг (одностраничный)</option>
          <option value="corporate" selected>Корпоративный сайт</option>
          <option value="catalog">Сайт-каталог / Интернет-магазин</option>
          <option value="crm_site">Сайт со сложным бэкэндом</option>
          <option value="quiz_site">Сайт-квиз</option>
        </select>
      </div>

      <!-- Количество сложных страниц -->
      <div>
        <div class="flex justify-between items-center text-sm font-medium text-slate-300 mb-1">
          <span>Сложные / Уникальные страницы</span>
          <input type="number" id="complexPages" min="1" max="20" value="2" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-0.5 text-indigo-400 font-bold text-center outline-none focus:border-indigo-500">
        </div>
        <p class="text-xs text-slate-400">Главная, каталог, карточка товара, квиз и т.д.</p>
      </div>

      <!-- Количество типовых страниц -->
      <div>
        <div class="flex justify-between items-center text-sm font-medium text-slate-300 mb-1">
          <span>Типовые / Текстовые страницы</span>
          <input type="number" id="simplePages" min="0" max="50" value="3" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-0.5 text-indigo-400 font-bold text-center outline-none focus:border-indigo-500">
        </div>
        <p class="text-xs text-slate-400">Контакты, о компании, текстовые блоки, политика и т.д.</p>
      </div>

      <!-- Сложность -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Уровень сложности верстки</label>
        <select id="complexity" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="1" selected>Базовый уровень (1x)</option>
          <option value="1.1">Повышенная сложность (1.10x)</option>
          <option value="1.2">Высокая сложность (1.20x)</option>
        </select>
      </div>

      <!-- Скорость согласования / Бюрократия -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Сроки согласования клиентом</label>
        <select id="approvalTime" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="2">Быстрое (2 раб. дня на этап)</option>
          <option value="3" selected>Обычное / Бюрократия (3 раб. дня на этап)</option>
          <option value="5">Высокая бюрократия (5 раб. дней на этап)</option>
        </select>
      </div>

      <!-- Буфер на риски -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Буфер на риски команды</label>
        <select id="risk" class="w-full bg-slate-700 border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="1">Без буфера (0%)</option>
          <option value="1.15" selected>Стандартный (+15%)</option>
          <option value="1.25">Максимальный (+25%)</option>
        </select>
      </div>
    </div>

    <!-- Результаты -->
    <div class="lg:col-span-7 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-start mb-4">
          <h2 class="text-xl font-bold text-indigo-400">График и этапы</h2>
          <div class="text-right">
            <div class="text-3xl font-extrabold text-white"><span id="totalDays">0</span> <span class="text-base font-normal text-slate-400">раб. дней</span></div>
            <div class="text-xs text-slate-400 mt-0.5">Работа: <span id="workDays" class="text-indigo-300 font-medium">0</span> дн. | Согласования: <span id="approvalDays" class="text-amber-300 font-medium">0</span> дн.</div>
          </div>
        </div>

        <div id="stagesList" class="space-y-2.5 my-4">
          <!-- Сюда рендерятся этапы -->
        </div>
      </div>

      <button onclick="copyEstimate()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition shadow-lg shadow-indigo-600/30">
        Скопировать оценку для КП
      </button>
    </div>
  </div>

  <script>
    const TYPE_DEV_COEFFS = {
      landing: 0,
      corporate: 1.0,
      catalog: 1.10,
      crm_site: 1.25,
      quiz_site: 1.4
    };

    function calculate() {
      const type = document.getElementById('projectType').value;
      const complexPages = Math.max(1, parseInt(document.getElementById('complexPages').value) || 1);
      const simplePages = Math.max(0, parseInt(document.getElementById('simplePages').value) || 0);

      const complexity = parseFloat(document.getElementById('complexity').value);
      const risk = parseFloat(document.getElementById('risk').value);
      const approvalDaysPerStage = parseInt(document.getElementById('approvalTime').value);

      // 1. Концепт: фиксированное окно
      let conceptDays = type === 'landing' ? 3 : 6;

      // 2. Дизайн: 
      // Сложные страницы: 1 страница = 1 день. Типовые: 0.4 дня на страницу.
      let designDays = 0;
      if (type === 'landing') {
        designDays = 4;
      } else {
        designDays = Math.ceil((complexPages * 1.0) + (simplePages * 0.4));
        if (designDays < 2) designDays = 2;
      }

      // 3. Сборка (Верстка):
      let devDays = 0;
      if (type === 'landing') {
        devDays = Math.round(7 * complexity * risk);
      } else {
        const typeCoeff = TYPE_DEV_COEFFS[type];
        
        // Сложные страницы: 3 дня * коэфф. типа * коэфф. сложности
        const complexDevTime = complexPages * (3 * typeCoeff * complexity);
        
        // Типовые страницы: всего 0.5 дня на страницу (не зависят сильно от типа сайта)
        const simpleDevTime = simplePages * 0.5;

        devDays = Math.round((complexDevTime + simpleDevTime) * risk);
        if (devDays < 3) devDays = 3;
      }

      // 4. Тестирование и запуск
      const totalPages = complexPages + simplePages;
      let qaDays = totalPages > 10 ? 4 : 2;

      const actualWorkTotal = conceptDays + designDays + devDays + qaDays;
      const totalApprovalDays = approvalDaysPerStage * 3;
      const grandTotalDays = actualWorkTotal + totalApprovalDays;

      document.getElementById('totalDays').innerText = grandTotalDays;
      document.getElementById('workDays').innerText = actualWorkTotal;
      document.getElementById('approvalDays').innerText = totalApprovalDays;

      const stages = [
        { name: '1. Концепт дизайна (2 варианта)', days: conceptDays, type: 'work' },
        { name: '2. Согласование концепта', days: approvalDaysPerStage, type: 'approval' },
        { name: '3. Дизайн оставшихся страниц + адаптив', days: designDays, type: 'work' },
        { name: '4. Согласование дизайна', days: approvalDaysPerStage, type: 'approval' },
        { name: '5. Сборка сайта (верстка + адаптив)', days: devDays, type: 'work' },
        { name: '6. Итоговое согласование сборки', days: approvalDaysPerStage, type: 'approval' },
        { name: '7. Тестирование и запуск', days: qaDays, type: 'work' }
      ];

      const stagesContainer = document.getElementById('stagesList');
      stagesContainer.innerHTML = '';

      stages.forEach(stage => {
        const isApproval = stage.type === 'approval';
        const bgBadge = isApproval ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20';
        
        stagesContainer.innerHTML += `
          <div class="flex justify-between items-center text-sm p-2.5 rounded-lg bg-slate-700/40 border border-slate-700">
            <span class="${isApproval ? 'text-slate-400 italic' : 'text-slate-200'}">${stage.name}</span>
            <span class="px-2.5 py-0.5 rounded text-xs font-semibold border ${bgBadge}">
              ${stage.days} раб. ${stage.days === 1 ? 'день' : stage.days < 5 ? 'дня' : 'дней'}
            </span>
          </div>
        `;
      });
    }

    function copyEstimate() {
      const total = document.getElementById('totalDays').innerText;
      const work = document.getElementById('workDays').innerText;
      const approval = document.getElementById('approvalDays').innerText;

      let text = `Оценка сроков разработки проекта:\n`;
      text += `Общий календарный срок: ${total} рабочих дней (Производство: ${work} дн. | Согласования: ${approval} дн.)\n\n`;
      text += `Поэтапный график:\n`;

      const stageElements = document.querySelectorAll('#stagesList > div');
      stageElements.forEach(el => {
        const name = el.children[0].innerText;
        const days = el.children[1].innerText;
        text += `- ${name}: ${days}\n`;
      });

      navigator.clipboard.writeText(text);
      alert('График проекта скопирован в буфер обмена!');
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    calculate();
  </script>
</body>
</html>
